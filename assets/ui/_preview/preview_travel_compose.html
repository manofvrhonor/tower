<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Travel menu preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #121212;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      font-family: Consolas, monospace;
      color: #8ab;
      gap: 20px;
      padding: 24px;
    }
    h1 { font-size: 14px; font-weight: normal; letter-spacing: 0.04em; color: #33e0ff; }
    .label { font-size: 12px; color: #667; text-align: center; margin-bottom: 8px; }
    .stage {
      position: relative;
      width: 1536px;
      height: 1024px;
      background: #05080c;
      box-shadow: 0 0 0 1px #333;
    }
    .panel { position: absolute; inset: 0; width: 100%; height: 100%; }
    .btn {
      position: absolute;
      width: 300px;
      height: 90px;
      object-fit: fill;
      transform: translate(-50%, -50%);
      z-index: 2;
    }
    .marker {
      position: absolute;
      width: 202px;
      height: 374px;
      object-fit: fill;
      transform: translate(-50%, -50%);
      z-index: 1;
    }
    .close {
      position: absolute;
      width: 300px;
      height: 90px;
      object-fit: fill;
      transform: translate(-50%, -50%);
      z-index: 2;
    }
    .icon {
      position: absolute;
      width: 96px;
      height: 96px;
      object-fit: fill;
      transform: translate(-50%, -50%);
      z-index: 2;
    }
    /* 300×90; gap ~51px → centers 417 / 768 / 1119 */
    #past    { left: 417px; top: 512px; }
    #present { left: 768px; top: 512px; }
    #future  { left: 1119px; top: 512px; }
    #marker  { left: 768px; top: 512px; }
    #close   { left: 768px; top: 877px; }
    #home    { left: 170px; top: 512px; }
    #gear    { left: 1366px; top: 512px; }
    .meta { font-size: 12px; color: #667; margin-bottom: 40px; }
  </style>
</head>
<body>
  <h1>TRAVEL — кнопки 300×90 (PNG переделаешь)</h1>

  <div>
    <div class="label">меню (слоты 300×90)</div>
    <div class="stage" id="stage">
      <img class="panel" src="../travel/panel_travel.png?v=8" alt="panel" />
      <img class="marker" id="marker" src="../travel/marker_here.png?v=8" alt="here" />
      <img class="btn" id="past" src="../travel/btn_past_idle.png?v=8" alt="past" />
      <img class="btn" id="present" src="../travel/btn_present_current.png?v=8" alt="present" />
      <img class="btn" id="future" src="../travel/btn_future_idle.png?v=8" alt="future" />
      <img class="close" id="close" src="../travel/btn_close_idle.png?v=8" alt="close" />
      <img class="icon" id="home" src="../travel/icon_home_off.png?v=8" alt="home" />
      <img class="icon" id="gear" src="../travel/icon_gear_off.png?v=8" alt="gear" />
    </div>
  </div>

  <p class="meta">эпохи/закрыть 300×90 | marker 202×374</p>
</body>
</html>
