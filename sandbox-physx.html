<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tower — Sandbox: PhysX + grab + hand-controls</title>
  <meta name="description" content="Sandbox to verify PhysX physics and physx-grab work in this project before migrating index.html.">

  <!-- A-Frame 1.7.1 (matches PhysX examples) -->
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.7.1/dist/aframe-master.min.js"></script>

  <!-- PhysX engine: @c-frame/physx v0.3.0 -->
  <script src="https://cdn.jsdelivr.net/gh/c-frame/physx@v0.3.0/dist/physx.min.js"></script>

  <!-- physx-grab component (local copy from examples/components/grab.js) -->
  <script src="js/components/physx-grab.js"></script>
</head>
<body>

  <a-scene
    background="color: #87CEEB"
    physx="
      autoLoad: true;
      delay: 1000;
      useDefaultScene: true;
      wasmUrl: https://cdn.jsdelivr.net/gh/c-frame/physx@v0.3.0/wasm/physx.release.wasm;
      stats: panel
    ">

    <!-- Visual floor for orientation. PhysX default scene already provides invisible ground at y=0. -->
    <a-plane
      position="0 0 0"
      rotation="-90 0 0"
      width="6" height="6"
      color="#7BC8A4"
      shadow="receive: true">
    </a-plane>

    <!-- Test cube: dynamic body, will fall to the floor and can be grabbed -->
    <a-box
      id="test-cube"
      position="0 1.5 -0.6"
      width="0.2" height="0.2" depth="0.2"
      color="#E07B53"
      physx-body="type: dynamic"
      shadow="cast: true">
    </a-box>

    <a-box
        id="base-cube"
        position="0 0.1 -0.6"
        width="0.2" height="0.2" depth="0.2"
        color="#5577AA"
        physx-body="type: dynamic">
    </a-box>

    <!-- Player rig -->
    <a-entity id="player" position="0 0 0">

      <!-- Camera -->
      <a-entity
        id="head"
        camera
        look-controls
        wasd-controls="acceleration: 10"
        position="0 1.6 0">
      </a-entity>

      <!-- Left hand: hand-controls + physx-grab + child collider sphere -->
      <a-entity
        id="left-hand"
        hand-controls="hand: left"
        physx-grab>
        <a-sphere
          id="left-hand-collider"
          radius="0.02"
          visible="false"
          physx-body="type: kinematic; emitCollisionEvents: true">
        </a-sphere>
      </a-entity>

      <!-- Right hand: hand-controls + physx-grab + child collider sphere -->
      <a-entity
        id="right-hand"
        hand-controls="hand: right"
        physx-grab>
        <a-sphere
          id="right-hand-collider"
          radius="0.02"
          visible="false"
          physx-body="type: kinematic; emitCollisionEvents: true">
        </a-sphere>
      </a-entity>

    </a-entity>

    <!-- Lights -->
    <a-light type="ambient" color="#BBB" intensity="0.6"></a-light>
    <a-light type="directional" color="#FFF" intensity="0.8" position="-1 2 1" castShadow="true"></a-light>

  </a-scene>

</body>
</html>
