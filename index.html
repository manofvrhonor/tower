<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tower — VR Workshop</title>
  <link rel="icon" href="data:,">

  <!-- A-Frame core (1.7.1, требуется для @c-frame/physx) -->
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.7.1/dist/aframe-master.min.js"></script>

  <!-- PhysX engine (@c-frame/physx v0.3.0) -->
  <script src="https://cdn.jsdelivr.net/gh/c-frame/physx@v0.3.0/dist/physx.min.js"></script>

  <!-- Локальный компонент захвата (joint-based, dynamic bodies сохраняются) -->
  <script src="js/components/physx-grab.js"></script>

  <!-- Стили -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- Конфиг и логика. Порядок важен:
       1) config.js — глобальный CONFIG;
       2) init-session.js — shuffle stackColors до парсинга сцены;
       3) floating-cube.js — компонент до парсинга <a-scene>;
       4) spawn-*.js — спавн по startGame() из game-lifecycle.js;
       5) dome-builder.js, ghost-tower-hint.js, victory-check.js — до <a-scene>;
       menu-ui-draw.js — canvas-плашки меню (до game-menu / victory-ui);
       6) main.js — диагностика. -->
  <script src="js/config.js"></script>
  <script src="js/assembly-zone.js"></script>
  <script src="js/menu-ui-draw.js"></script>
  <script src="js/init-session.js"></script>
  <script src="js/game-lifecycle.js"></script>
  <script src="js/desktop-ui-cursor.js"></script>
  <script src="js/components/time-scale.js"></script>
  <script src="js/components/slowmo-vignette-3d.js"></script>
  <script src="js/components/floating-cube.js"></script>
  <script src="js/components/red-ball.js"></script>
  <script src="js/components/ball-bat.js"></script>
  <script src="js/components/float-motion-trail.js"></script>
  <script src="js/room-spawn-utils.js"></script>
  <script src="js/room-containment.js"></script>
  <script src="js/spawn-floating-cubes.js"></script>
  <script src="js/spawn-red-balls.js"></script>
  <script src="js/ball-wave-manager.js"></script>
  <script src="js/spawn-ball-bat.js"></script>
  <script src="js/components/dome-builder.js"></script>
  <script src="js/components/orbit-ring.js"></script>
  <script src="js/components/assembly-hub.js"></script>
  <script src="js/components/assembly-sphere-visual.js"></script>
  <script src="js/components/collider-debug-viz.js"></script>
  <script src="js/components/ghost-tower-hint.js"></script>
  <script src="js/components/assembly-core.js"></script>
  <script src="js/components/victory-check.js"></script>
  <script src="js/components/victory-ui.js"></script>
  <script src="js/components/game-menu.js"></script>
  <script src="js/components/world-hdri-sky.js"></script>
  <script src="js/components/room-fog-dome.js"></script>
  <script src="js/components/room-dome-collider.js"></script>
  <script src="js/main.js" defer></script>
</head>

<body>
  <a-scene
    victory-check
    victory-ui
    game-menu
    collider-debug-viz
    physx="
      autoLoad: true;
      delay: 1000;
      useDefaultScene: false;
      gravity: 0 -9.8 0;
      wasmUrl: https://cdn.jsdelivr.net/gh/c-frame/physx@v0.3.0/wasm/physx.release.wasm
    ">

    <!-- ====== АССЕТЫ ====== -->
    <a-assets>
      <a-asset-item id="leftHandModel" src="assets/models/leftHandLow.glb"></a-asset-item>
      <a-asset-item id="rightHandModel" src="assets/models/rightHandLow.glb"></a-asset-item>
    </a-assets>

    <!-- Мировое небо (корень сцены). HDR: положить в assets/hdri/ — random при reload -->
    <a-entity id="world-sky" world-hdri-sky></a-entity>

    <!-- Туманный купол комнаты (визуал) + room-dome-collider (PhysX). -->
    <a-entity id="room-fog-dome" room-fog-dome></a-entity>
    <a-entity id="room-collider" room-dome-collider></a-entity>

    <!-- ====== КОМНАТА — пол (PhysX). Стены/потолок = room-dome-collider ====== -->

    <!-- Пол: a-box, id=#floor для contactbegin (floating-cube). Ø = 2× fogDome.radius; визуал — room-fog-dome -->
    <a-box id="floor" position="0 -0.05 0" width="4" height="0.1" depth="4" visible="false"
           physx-body="type: static"
           physx-material="restitution: 0.15; staticFriction: 0.70; dynamicFriction: 0.60; collisionLayers: 0; collidesWithLayers: 2, 3, 4, 5, 7, 8, 9"></a-box>


    <!-- ====== ЯДРО СБОРКИ (Фаза 2.x): орбитальные кольца + белая сфера ====== -->
    <a-entity id="assembly-hub" assembly-hub position="0 0.985 0">
      <a-entity id="orbit-ring-0" orbit-ring="index: 0"></a-entity>
      <a-entity id="orbit-ring-1" orbit-ring="index: 1"></a-entity>
      <a-entity id="assembly-core" assembly-core position="0 0.015 0"></a-entity>
      <a-entity id="dome-collider" dome-builder></a-entity>
      <a-entity id="assembly-sphere-visual" assembly-sphere-visual></a-entity>
    </a-entity>

    <a-entity id="ghost-tower-hint" ghost-tower-hint position="0 0 0" visible="false"></a-entity>


    <!-- ====== ПЛАВАЮЩИЕ КУБИКИ (5 цветных + 6 серых) ======
         Контейнер пустой до «Старт»; spawn-floating-cubes.js по startGame(). -->
    <a-entity id="floating-cubes-root"></a-entity>

    <!-- Красные шары (Этап 6). spawn-red-balls.js наполняет контейнер. -->
    <a-entity id="red-balls-root"></a-entity>

    <!-- Бита — случайный спавн в большом куполе. spawn-ball-bat.js -->
    <a-entity id="ball-bat-root"></a-entity>


    <!-- ====== ИГРОК ====== -->
    <a-entity id="player" position="0 0 1">
      <a-camera position="0 1.6 0" look-controls wasd-controls slowmo-vignette-3d></a-camera>

      <!-- Левая рука: hand-controls + physx-grab + дочерний коллайдер -->
      <a-entity id="leftHand"
                hand-controls="hand: left; handModelStyle: lowPoly; color: #ffffff"
                gltf-model="#leftHandModel"
                physx-grab>
        <a-sphere id="leftHandCollider"
                  radius="0.05"
                  visible="false"
                  data-physx-hidden-collider
                  physx-body="type: kinematic; emitCollisionEvents: true"
                  physx-material="collisionLayers: 6; collidesWithLayers: 2, 3, 4, 5, 7">
        </a-sphere>
      </a-entity>

      <!-- Правая рука: hand-controls + physx-grab + дочерний коллайдер -->
      <a-entity id="rightHand"
                hand-controls="hand: right; handModelStyle: lowPoly; color: #ffffff"
                gltf-model="#rightHandModel"
                physx-grab>
        <a-sphere id="rightHandCollider"
                  radius="0.05"
                  visible="false"
                  data-physx-hidden-collider
                  physx-body="type: kinematic; emitCollisionEvents: true"
                  physx-material="collisionLayers: 6; collidesWithLayers: 2, 3, 4, 5, 7">
        </a-sphere>
      </a-entity>
    </a-entity>

  </a-scene>
</body>
</html>
